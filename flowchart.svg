<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 820" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="840" height="820" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Title -->
  <text x="420" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">MAIL-AGENT WORKFLOW ARCHITECTURE</text>
  <text x="420" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">LangGraph State Machine with Human-in-the-Loop (HITL) Interruption</text>

  <!-- Connectors / Lines -->
  <!-- Start -> Retriever -->
  <line x1="420" y1="135" x2="420" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Retriever -> Draft -->
  <line x1="420" y1="249" x2="420" y2="289" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Draft -> Review Node -->
  <line x1="420" y1="363" x2="420" y2="408" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Review Node -> Send Node (Approved) -->
  <path d="M 370 500 V 525 Q 370 545 330 545 H 270 V 576" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Review Node -> Cancel Node (Limit Exceeded) -->
  <path d="M 470 500 V 525 Q 470 545 510 545 H 570 V 576" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Review Node -> Draft Node (Feedback Loop) -->
  <path d="M 250 455 H 85 Q 65 455 65 435 V 346 Q 65 326 85 326 H 266" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-indigo)"/>

  <!-- Send Node -> End -->
  <path d="M 270 652 V 730 Q 270 755 295 755 H 356" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Cancel Node -> End -->
  <path d="M 570 652 V 730 Q 570 755 545 755 H 484" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- NODES -->

  <!-- START NODE -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="95" width="120" height="40" rx="20" fill="#0d9488" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="420" y="120" text-anchor="middle" fill="#f0fdfa" font-size="13" font-weight="700" letter-spacing="1">START</text>
  </g>

  <!-- RETRIEVER NODE -->
  <g filter="url(#card-shadow)">
    <rect x="270" y="175" width="300" height="74" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="420" y="206" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">🔍 Retriever Node</text>
    <text x="420" y="230" text-anchor="middle" fill="#94a3b8" font-size="12" font-style="italic">Extracts recipient &amp; reason (Pydantic)</text>
  </g>

  <!-- DRAFT NODE -->
  <g filter="url(#card-shadow)">
    <rect x="270" y="289" width="300" height="74" rx="12" fill="#111827" stroke="#818cf8" stroke-width="2"/>
    <text x="420" y="320" text-anchor="middle" fill="#818cf8" font-size="15" font-weight="700">✍️ Draft Node</text>
    <text x="420" y="344" text-anchor="middle" fill="#94a3b8" font-size="12" font-style="italic">Generates or revises email (&lt;= 200 words)</text>
  </g>

  <!-- REVIEW NODE (HITL) -->
  <g filter="url(#glow-amber)">
    <rect x="250" y="410" width="340" height="90" rx="14" fill="#18182b" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Badge -->
    <rect x="345" y="399" width="150" height="22" rx="11" fill="#b45309" stroke="#f59e0b" stroke-width="1"/>
    <text x="420" y="414" text-anchor="middle" fill="#fef3c7" font-size="10.5" font-weight="800" letter-spacing="0.5">⚡ HITL INTERRUPT</text>
    <!-- Content -->
    <text x="420" y="449" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">👤 Review Node</text>
    <text x="420" y="473" text-anchor="middle" fill="#cbd5e1" font-size="12" font-style="italic">interrupt() for user review &amp; feedback</text>
  </g>

  <!-- BRANCH LABELS -->
  <!-- Feedback loop label -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="372" width="165" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="97" y="390" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="700">Feedback provided</text>
    <text x="97" y="405" text-anchor="middle" fill="#a5b4fc" font-size="10.5">(Count &lt;= 2)</text>
  </g>

  <!-- Approved label -->
  <g filter="url(#card-shadow)">
    <rect x="200" y="532" width="140" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="270" y="549" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">Approved ('yes')</text>
  </g>

  <!-- Cancel label -->
  <g filter="url(#card-shadow)">
    <rect x="475" y="532" width="190" height="26" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="570" y="549" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700">Feedback limit exceeded (&gt; 2)</text>
  </g>

  <!-- SEND NODE -->
  <g filter="url(#card-shadow)">
    <rect x="150" y="580" width="240" height="72" rx="12" fill="#06281e" stroke="#10b981" stroke-width="2"/>
    <text x="270" y="611" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">✉️ Send Node</text>
    <text x="270" y="634" text-anchor="middle" fill="#6ee7b7" font-size="12" font-style="italic">Dispatches email</text>
  </g>

  <!-- CANCEL NODE -->
  <g filter="url(#card-shadow)">
    <rect x="450" y="580" width="240" height="72" rx="12" fill="#2b0914" stroke="#f43f5e" stroke-width="2"/>
    <text x="570" y="611" text-anchor="middle" fill="#fb7185" font-size="15" font-weight="700">🛑 Cancel Node</text>
    <text x="570" y="634" text-anchor="middle" fill="#fda4af" font-size="12" font-style="italic">Terminates without sending</text>
  </g>

  <!-- END NODE -->
  <g filter="url(#card-shadow)">
    <rect x="360" y="735" width="120" height="40" rx="20" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="420" y="760" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700" letter-spacing="1">END</text>
  </g>

</svg>
